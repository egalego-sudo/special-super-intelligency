name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Pull sandbox image and pin its digest for this run
        run: |
          docker pull python:3.11-slim
          echo "SSI_SANDBOX_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.11-slim)" >> "$GITHUB_ENV"
      - name: Run tests
        run: pytest -q
      - name: Check formatting and lint
        run: ruff check .
