name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, android-control-app-v1]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Locate Android SDK tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify Android JVM unit test report
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          if not reports:
              raise SystemExit("No Android JVM unit test XML reports were produced.")
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print("Android JVM unit tests:", totals)
          if totals["tests"] < 1 or totals["failures"] or totals["errors"]:
              raise SystemExit("Android JVM unit tests did not pass.")
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: special-super-intelligency-control-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
