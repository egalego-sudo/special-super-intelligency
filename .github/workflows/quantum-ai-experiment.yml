name: QUANTUM AI Multi-Seed Research Experiment

on:
  push:
    branches:
      - android-control-app-v1
    paths:
      - "src/special_super_intelligency/**"
      - "scripts/run_decoder_seed_sweep.py"
      - ".github/workflows/quantum-ai-experiment.yml"
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs per seed
        required: false
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  multi-seed-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Run deterministic multi-seed sweep
        env:
          SWEEP_EPOCHS: ${{ inputs.epochs || '20' }}
        run: |
          mkdir -p artifacts
          python scripts/run_decoder_seed_sweep.py \
            --seeds 131 137 139 \
            --epochs "$SWEEP_EPOCHS" \
            --output artifacts/quantum-ai-seed-sweep.json
      - name: Upload experiment report
        uses: actions/upload-artifact@v4
        with:
          name: quantum-ai-multi-seed-report
          path: artifacts/quantum-ai-seed-sweep.json
          if-no-files-found: error
          retention-days: 30
